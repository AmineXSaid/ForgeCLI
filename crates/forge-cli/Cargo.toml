[package]
name = "forge-cli"
description = "The forge binary: interactive and print modes, the stream-json host protocol, subcommands."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "forge"
path = "src/main.rs"

[dependencies]
forge-types.workspace = true
forge-api.workspace = true
forge-config.workspace = true
forge-permissions.workspace = true
forge-session.workspace = true
forge-engine.workspace = true
forge-agents.workspace = true
forge-core.workspace = true
anyhow.workspace = true
async-trait.workspace = true
clap.workspace = true
clap_complete = "4"
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
forge-test-host.workspace = true
forge-eval.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
