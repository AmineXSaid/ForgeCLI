[package]
name = "kodact-cli"
description = "The kodact binary: interactive and print modes, the stream-json host protocol, subcommands."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "kodact"
path = "src/main.rs"

[dependencies]
kodact-platform.workspace = true
kodact-types.workspace = true
kodact-api.workspace = true
kodact-config.workspace = true
kodact-permissions.workspace = true
kodact-session.workspace = true
kodact-engine.workspace = true
kodact-agents.workspace = true
kodact-tools.workspace = true
kodact-core.workspace = true
kodact-mcp.workspace = true
kodact-git.workspace = true
chrono.workspace = true
anyhow.workspace = true
async-trait.workspace = true
clap.workspace = true
clap_complete = "4"
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
futures.workspace = true
ignore.workspace = true
base64.workspace = true
# The interactive UI (docs/TUI.md).
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
unicode-width = "0.2"

[build-dependencies]
# The Windows .exe icon (build.rs).
embed-resource = "=3.0.12"

[dev-dependencies]
tempfile.workspace = true
shlex.workspace = true
kodact-test-host.workspace = true
kodact-eval.workspace = true

