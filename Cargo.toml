[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.87"
repository = "https://github.com/AmineXSaid/KodAct"
homepage = "https://github.com/AmineXSaid/KodAct"
readme = "README.md"
keywords = ["agent", "llm", "cli", "coding-assistant", "terminal"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
dirs = "6"
flate2 = "1"
futures = "0.3"
globset = "0.4"
ignore = "0.4"
lopdf = { version = "0.45", default-features = false }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
shlex = "1"
similar = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

kodact-types = { path = "crates/kodact-types", version = "0.1.0" }
kodact-platform = { path = "crates/kodact-platform", version = "0.1.0" }
kodact-api = { path = "crates/kodact-api", version = "0.1.0" }
kodact-config = { path = "crates/kodact-config", version = "0.1.0" }
kodact-permissions = { path = "crates/kodact-permissions", version = "0.1.0" }
kodact-hooks = { path = "crates/kodact-hooks", version = "0.1.0" }
kodact-tools = { path = "crates/kodact-tools", version = "0.1.0" }
kodact-session = { path = "crates/kodact-session", version = "0.1.0" }
kodact-git = { path = "crates/kodact-git", version = "0.1.0" }
kodact-engine = { path = "crates/kodact-engine", version = "0.1.0" }
kodact-compact = { path = "crates/kodact-compact", version = "0.1.0" }
kodact-mcp = { path = "crates/kodact-mcp", version = "0.1.0" }
kodact-agents = { path = "crates/kodact-agents", version = "0.1.0" }
kodact-core = { path = "crates/kodact-core", version = "0.1.0" }
kodact-cli = { path = "crates/kodact-cli", version = "0.1.0" }
# Test support only (publish = false): no version, so it stays out of published manifests.
kodact-test-host = { path = "crates/kodact-test-host" }
kodact-eval = { path = "crates/kodact-eval", version = "0.1.0" }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# Keep debug builds small: line tables are enough for backtraces, and dependencies need none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
