[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/AmineXSaid/ForgeCLI"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
dirs = "6"
futures = "0.3"
globset = "0.4"
ignore = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
shlex = "1"
similar = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

forge-types = { path = "crates/forge-types" }
forge-api = { path = "crates/forge-api" }
forge-config = { path = "crates/forge-config" }
forge-permissions = { path = "crates/forge-permissions" }
forge-hooks = { path = "crates/forge-hooks" }
forge-tools = { path = "crates/forge-tools" }
forge-core = { path = "crates/forge-core" }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
