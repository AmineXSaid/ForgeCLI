[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/AmineXSaid/KodAct"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
dirs = "6"
flate2 = "1"
futures = "0.3"
globset = "0.4"
ignore = "0.4"
lopdf = { version = "0.45", default-features = false }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
shlex = "1"
similar = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

kodact-types = { path = "crates/kodact-types" }
kodact-platform = { path = "crates/kodact-platform" }
kodact-api = { path = "crates/kodact-api" }
kodact-config = { path = "crates/kodact-config" }
kodact-permissions = { path = "crates/kodact-permissions" }
kodact-hooks = { path = "crates/kodact-hooks" }
kodact-tools = { path = "crates/kodact-tools" }
kodact-session = { path = "crates/kodact-session" }
kodact-git = { path = "crates/kodact-git" }
kodact-engine = { path = "crates/kodact-engine" }
kodact-compact = { path = "crates/kodact-compact" }
kodact-mcp = { path = "crates/kodact-mcp" }
kodact-agents = { path = "crates/kodact-agents" }
kodact-core = { path = "crates/kodact-core" }
kodact-cli = { path = "crates/kodact-cli" }
kodact-test-host = { path = "crates/kodact-test-host" }
kodact-eval = { path = "crates/kodact-eval" }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# Keep debug builds small: line tables are enough for backtraces, and dependencies need none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
